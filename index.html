<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7a55" />
    <meta name="color-scheme" content="light only" />
    <script>
      // 部署会删掉旧版的打包文件。浏览器若用了缓存里的旧 HTML，主脚本或样式会 404、页面白屏。
      // 这时带一个不缓存的参数整页刷新一次，拿到新 HTML；sessionStorage 防止循环刷新。
      addEventListener('error', function (e) {
        var t = e.target, u = t && (t.src || t.href) || ''
        if (!t || !/^(SCRIPT|LINK)$/.test(t.tagName) || u.indexOf('/assets/') < 0) return
        try { if (sessionStorage.getItem('stale-reload')) return; sessionStorage.setItem('stale-reload', '1') } catch (_) { return }
        location.replace(location.pathname + '?v=' + Date.now() + location.hash)
      }, true)
    </script>
    <title>顺路侠 · 校园跑腿互助</title>
    <link rel="stylesheet" href="/campus-errand/fonts/smiley-v2/result.css" media="print" onload="this.media='all'" />
    <link rel="icon" type="image/png" href="/campus-errand/brand/favicon-v2.png" />
    <link rel="apple-touch-icon" href="/campus-errand/brand/apple-touch-icon-v2.png" />
    <meta name="description" content="顺路侠：校内实名认证的跑腿互助平台。代取快递、代买、占座，赏金托管，信用越高能接的单越好。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
